[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "poly-storage-cli"
version = "0.2.0"
description = "Official CLI for the Entity Market Data API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "EntityML" }
]
dependencies = [
  "poly-storage-sdk>=0.2.0",
]
keywords = ["entityml", "polymarket", "kalshi", "cli", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
]

[project.scripts]
poly-storage = "poly_storage_cli.main:main"

[project.urls]
Homepage = "https://entityml.com"
Documentation = "https://entityml.com/documentation"
Repository = "https://github.com/agov12/poly-storage"
Issues = "https://github.com/agov12/poly-storage/issues"

[tool.hatch.build.targets.wheel]
packages = ["poly_storage_cli"]
